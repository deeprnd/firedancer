syntax = "proto3";

package tickoni.schema.v1;

enum Market {
  MARKET_UNSPECIFIED = 0;
  MARKET_US          = 1;
}

enum Venue {
  VENUE_UNSPECIFIED = 0;
  VENUE_NYSE        = 1;
  VENUE_NASDAQ      = 2;
}

enum AssetClass {
  ASSET_CLASS_UNSPECIFIED  = 0;
  ASSET_CLASS_EQUITY       = 1;
  ASSET_CLASS_FIXED_INCOME = 2;
  ASSET_CLASS_COMMODITY    = 3;
  ASSET_CLASS_FX           = 4;
  ASSET_CLASS_CRYPTO       = 5;
  ASSET_CLASS_CASH         = 6;
}

enum InstrumentType {
  INSTRUMENT_TYPE_UNSPECIFIED = 0;
  INSTRUMENT_TYPE_STOCK       = 1;
  INSTRUMENT_TYPE_ETF         = 2;
  INSTRUMENT_TYPE_BOND        = 3;
  INSTRUMENT_TYPE_OPTION      = 4;
  INSTRUMENT_TYPE_FUTURE      = 5;
  INSTRUMENT_TYPE_FUND        = 6;
  INSTRUMENT_TYPE_TOKEN       = 7;
}

enum RiskPreference {
  RISK_PREFERENCE_UNSPECIFIED = 0;
  RISK_PREFERENCE_LOW         = 1;
  RISK_PREFERENCE_MODERATE    = 2;
  RISK_PREFERENCE_HIGH        = 3;
}

message CanonicalId {
  string value = 1;
}

message ClassificationRef {
  CanonicalId taxonomy_id      = 1;
  uint32      taxonomy_version = 2;
  CanonicalId code             = 3;
}

message AssetClassList {
  repeated AssetClass values = 1;
}

message InstrumentTypeList {
  repeated InstrumentType values = 1;
}

message ThemeIdList {
  repeated CanonicalId values = 1;
}

message ClassificationRefList {
  repeated ClassificationRef values = 1;
}
