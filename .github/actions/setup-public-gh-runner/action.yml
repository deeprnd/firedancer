name: Setup Public GitHub Runner
description: Setup just, Zig, optional Python tooling, optional apt packages, and Firedancer deps on GitHub-hosted runners

inputs:
  apt-packages:
    description: Space-delimited apt packages to install
    required: false
    default: ''
  compiler:
    description: Compiler for Firedancer deps setup
    required: false
    default: gcc
  compiler-version:
    description: Compiler version for Firedancer deps setup
    required: false
    default: system
  fd-deps:
    description: Install Firedancer build dependencies
    required: false
    default: 'false'
  gitleaks:
    description: Install gitleaks
    required: false
    default: 'false'
  kcov:
    description: Build and install kcov from source
    required: false
    default: 'false'
  python-tools:
    description: Space-delimited Python packages to install with pip
    required: false
    default: ''
  zig:
    description: Install Zig
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@just

    - name: Install gmake on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: brew install gmake

    - name: Setup Zig
      if: inputs.zig == 'true'
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Setup Python
      if: inputs.python-tools != ''
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Python tools
      if: inputs.python-tools != ''
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ${{ inputs.python-tools }}

    - name: Install apt packages
      if: inputs.apt-packages != ''
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ inputs.apt-packages }}

    - name: Install kcov
      if: inputs.kcov == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          binutils-dev \
          cmake \
          libcurl4-openssl-dev \
          libdw-dev \
          libelf-dev \
          libiberty-dev \
          libssl-dev \
          libstdc++-12-dev \
          zlib1g-dev
        git clone --depth 1 https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov-src"
        cmake -S "$RUNNER_TEMP/kcov-src" -B "$RUNNER_TEMP/kcov-build"
        make -j$(nproc) -C "$RUNNER_TEMP/kcov-build"
        sudo make -C "$RUNNER_TEMP/kcov-build" install

    - name: Install Gitleaks
      if: inputs.gitleaks == 'true'
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        mkdir -p "$RUNNER_TEMP/gitleaks"
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz"
        tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
        chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"
        echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

    - name: Install Firedancer deps
      if: inputs.fd-deps == 'true'
      uses: ./.github/actions/deps
      with:
        compiler: ${{ inputs.compiler }}
        compiler-version: ${{ inputs.compiler-version }}
        extras: +dev
