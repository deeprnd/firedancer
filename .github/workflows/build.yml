name: Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/|config/|deps\.sh$|contrib/deps-bundle\.sh$|justfile$|\.github/actions/|\.github/workflows/build\.yml$)'

  build-gcc:
    name: Engine Build / GCC
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 12
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          fd-deps: 'true'
          compiler: gcc
          compiler-version: system

      - name: Run build
        run: just build-fd-gcc

  build-tk:
    name: Harness Build
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Run build
        run: just build-tk

  build-clang:
    name: Engine Build / Clang
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          fd-deps: 'true'
          compiler: clang
          compiler-version: system

      - name: Run build
        run: just build-fd-clang

  build-arm:
    name: Engine Build / ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          fd-deps: 'true'
          compiler: gcc
          compiler-version: system

      - name: Run build
        run: just build-fd-arm
