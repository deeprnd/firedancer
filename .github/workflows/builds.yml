# Builds for all compilers, architectures and targets

name: Builds
on:
  workflow_call:
    inputs:
      cid:
        type: string
        description: Unique identifier to allow concurrency
        default: "0"
      gcc:
        type: string
        description: GCC versions to use
        default: all
      clang:
        type: string
        description: Clang versions to use
        default: all
      machine:
        type: string
        description: Machines to build for
        default: all
      gcc_exceptions:
        type: string
        description: Exception groups for gcc
        default: none
      clang_exceptions:
        type: string
        description: Exception groups for clang
        default: none
      build_arm:
        type: boolean
        description: Run arm builds
        default: false
      dry_run:
        type: boolean
        description: Print build matrix and exit
        default: false
      check_run:
        type: boolean
        description: Run `make check` instead of full builds
        default: false
      exit_on_err:
        type: boolean
        description: Exit on the first error
        default: false
      no_optimization:
        type: boolean
        description: Compile with optimizations disabled
        default: false
      verbose:
        type: boolean
        description: Show output from failed builds
        default: false
      gcc_runner_labels:
        type: string
        description: Runner labels where gcc jobs will get scheduled
        default: '["ubuntu-latest"]'
      clang_runner_labels:
        type: string
        description: Runner labels where clang jobs will get scheduled
        default: '["ubuntu-latest"]'
      arm_runner_labels:
        type: string
        description: Runner labels where arm jobs will get scheduled
        default: '["ubuntu-latest"]'
  workflow_dispatch:
    inputs:
      cid:
        type: string
        description: Unique identifier to allow concurrency
        default: "0"
      gcc:
        type: string
        description: GCC versions to use (comma-separated | none | all)
        default: all
      clang:
        type: string
        description: Clang versions to use (comma-separated | none | all)
        default: all
      machine:
        type: string
        description: Machines to build for (comma-separated | all)
        default: all
      gcc_exceptions:
        type: string
        description: Exception groups for gcc (comma-separated and semi-colon delimited | none)
        default: none
      clang_exceptions:
        type: string
        description: Exception groups for clang (comma-separated and semi-colon delimited | none)
        default: none
      build_arm:
        type: boolean
        description: Run arm builds
        default: false
      dry_run:
        type: boolean
        description: Print build matrix and exit
        default: false
      check_run:
        type: boolean
        description: Run `make check` instead of full builds
        default: false
      exit_on_err:
        type: boolean
        description: Exit on the first error
        default: false
      no_optimization:
        type: boolean
        description: Compile with optimizations disabled
        default: false
      verbose:
        type: boolean
        description: Show output from failed builds
        default: false
      gcc_runner_labels:
        type: string
        description: Runner labels where gcc jobs will get scheduled
        default: '["ubuntu-latest"]'
      clang_runner_labels:
        type: string
        description: Runner labels where clang jobs will get scheduled
        default: '["ubuntu-latest"]'
      arm_runner_labels:
        type: string
        description: Runner labels where arm jobs will get scheduled
        default: '["ubuntu-latest"]'
concurrency:
  group: builds_${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.cid }}
  cancel-in-progress: true
jobs:
  build_gcc:
    runs-on:
      labels: ${{ fromJSON(inputs.gcc_runner_labels) }}
    if: ${{ inputs.gcc != 'none' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install gcc-12
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12
          sudo mkdir -p /opt/gcc/gcc-12.4.0
          printf 'export CC=gcc-12\nexport CXX=g++-12\n' | sudo tee /opt/gcc/gcc-12.4.0/activate

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: ./.github/actions/deps
        with:
          compiler: gcc
          compiler-version: 12.4.0
          extras: +dev

      - name: Build command line args
        run: |
          ARGS=""
          # dry-run
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # check-run
          if [ "${{ inputs.check_run }}" == "true" ]; then
            ARGS="$ARGS --check-run --no-deps"
          fi
          # exit-on-err
          if [ "${{ inputs.exit_on_err }}" == "true" ]; then
            ARGS="$ARGS --exit-on-err"
          fi
          # machine
          if [ ! -z "${{ inputs.machine }}" ] && [ "${{ inputs.machine }}" != "all" ]; then
            ARGS="$ARGS --machines ${{ inputs.machine }}"
          fi
          # gcc
          if [ ! -z "${{ inputs.gcc }}" ] && [ "${{ inputs.gcc }}" != "all" ]; then
            ARGS="$ARGS --gcc-versions ${{ inputs.gcc }}"
          fi
          # no-optimization
          if [ "${{ inputs.no_optimization }}" == "true" ]; then
            ARGS="$ARGS --no-optimization"
          fi
          # verbose
          if [ "${{ inputs.verbose }}" == "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          # exceptions
          if [ ! -z "${{ inputs.gcc_exceptions }}" ] && [ "${{ inputs.gcc_exceptions }}" != "none" ]; then
            no_spaces=$(tr -d '[:space:]' <<< "${{ inputs.gcc_exceptions }}")
            IFS=';' read -r -a exceptions <<< "$no_spaces"
            for exception in ${exceptions[@]}; do
              ARGS="$ARGS --gcc-except $exception"
            done
          fi
          echo "BUILD_ARGS=$ARGS" >> $GITHUB_ENV

      - name: Run gcc builds
        run: |
          contrib/build.sh --no-rust --no-clang ${{ env.BUILD_ARGS }}

  build_clang:
    runs-on:
      labels: ${{ fromJSON(inputs.clang_runner_labels) }}
    if: ${{ inputs.clang != 'none' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-18 and clang-19
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo /tmp/llvm.sh 19
          sudo mkdir -p /opt/clang/clang-18.1.6 /opt/clang/clang-19.1.7
          printf 'export CC=clang-18\nexport CXX=clang++-18\nexport PATH="/usr/lib/llvm-18/bin:$PATH"\n' | sudo tee /opt/clang/clang-18.1.6/activate
          printf 'export CC=clang-19\nexport CXX=clang++-19\nexport PATH="/usr/lib/llvm-19/bin:$PATH"\n' | sudo tee /opt/clang/clang-19.1.7/activate

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: ./.github/actions/deps
        with:
          compiler: clang
          compiler-version: 18.1.6
          extras: +dev

      - name: Build command line args
        run: |
          ARGS=""
          # dry-run
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # check-run
          if [ "${{ inputs.check_run }}" == "true" ]; then
            ARGS="$ARGS --check-run --no-deps"
          fi
          # exit-on-err
          if [ "${{ inputs.exit_on_err }}" == "true" ]; then
            ARGS="$ARGS --exit-on-err"
          fi
          # machine
          if [ ! -z "${{ inputs.machine }}" ] && [ "${{ inputs.machine }}" != "all" ]; then
            ARGS="$ARGS --machines ${{ inputs.machine }}"
          fi
          # clang
          if [ ! -z "${{ inputs.clang }}" ] && [ "${{ inputs.clang }}" != "all" ]; then
            ARGS="$ARGS --clang-versions ${{ inputs.clang }}"
          fi
          # no-optimization
          if [ "${{ inputs.no_optimization }}" == "true" ]; then
            ARGS="$ARGS --no-optimization"
          fi
          # verbose
          if [ "${{ inputs.verbose }}" == "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          # exceptions
          if [ ! -z "${{ inputs.clang_exceptions }}" ] && [ "${{ inputs.clang_exceptions }}" != "none" ]; then
            no_spaces=$(tr -d '[:space:]' <<< "${{ inputs.clang_exceptions }}")
            IFS=';' read -r -a exceptions <<< "$no_spaces"
            for exception in ${exceptions[@]}; do
              ARGS="$ARGS --clang-except $exception"
            done
          fi
          echo "BUILD_ARGS=$ARGS" >> $GITHUB_ENV

      - name: Run clang builds
        run: |
          contrib/build.sh --no-rust --no-gcc ${{ env.BUILD_ARGS }}

  build_arm:
    runs-on:
      labels: ${{ fromJSON(inputs.arm_runner_labels) }}
    if: ${{ inputs.build_arm }}
    strategy:
      matrix:
        gcc_version: [12]
    steps:
      - uses: actions/checkout@v6

      - name: Install GCC ${{ matrix.gcc_version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-${{ matrix.gcc_version }} g++-${{ matrix.gcc_version }}

      - name: Run build
        env:
          MACHINE: linux_gcc_neoverse_n2
          CC: gcc-${{ matrix.gcc_version }}
          CXX: g++-${{ matrix.gcc_version }}
        run: |
          ./deps.sh fetch install
          make -j clean
          make -j all
