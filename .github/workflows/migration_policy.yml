name: Migration Policy

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: migration-policy_${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on:
      labels: X64
      group: fd-public-repo
    steps:
      - uses: actions/checkout@v6

      - name: Check Agave regressions
        run: bash contrib/lint/check_agave_regressions.sh

      - name: Check Tickoni migration policy
        run: bash contrib/lint/check_tickoni_policy.sh

      - name: Build tickoni and firedancer compatibility alias
        run: |
          make -j tickoni
          make -j firedancer
