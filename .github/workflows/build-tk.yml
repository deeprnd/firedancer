name: Build Tickoni

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-tk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^((src/tickoni/|src/app/tickoni/|contrib/fd-build-lib\.sh$|contrib/fd-tk-libs\.sh$|build\.zig$|\.zig-version$|GNUmakefile$|\.github/actions/build-fd-tk-libs/|\.github/workflows/build-tk\.yml$)|deps\.sh$)'

  # ── Linux: build FD libs + Zig tickoni ──────────────────────────────────────
  build-tk-linux:
    name: Harness Build / Linux
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Build FD libs
        uses: ./.github/actions/build-fd-tk-libs

      - name: Run Zig build
        run: just build-tk

  # ── macOS: Clang (x86_64) ──────────────────────────────────────────────────
  build-tk-macos-15-intel:
    name: Harness Build / macOS 15 (Intel)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-intel

      - name: Run Zig build
        run: just build-tk

  # ── macOS: Clang (ARM64) ───────────────────────────────────────────────────
  build-tk-macos-15-arm:
    name: Harness Build / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-arm

      - name: Run Zig build
        run: just build-tk

  # ── macOS: Clang (x86_64, macOS 26) ────────────────────────────────────────
  build-tk-macos-26-intel:
    name: Harness Build / macOS 26 (Intel)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-intel

      - name: Run Zig build
        run: just build-tk

  # ── macOS: Clang (ARM64, macOS 26) ─────────────────────────────────────────
  build-tk-macos-26-arm:
    name: Harness Build / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-arm

      - name: Run Zig build
        run: just build-tk
