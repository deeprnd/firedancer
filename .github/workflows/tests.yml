# Runs unit tests, script tests, and fuzz tests.

name: Tests
on:
  workflow_call:
    inputs:
      runner_labels:
        type: string
        description: Runner labels for test jobs
        default: '["ubuntu-latest"]'
      gigantic_page_cnt:
        type: string
        description: Number of gigantic (1 GiB) pages to allocate per NUMA node
        default: '64'
      job_mem:
        type: string
        description: Memory per test job in bytes, passed as --job-mem (empty = default 6 GiB)
        default: ''
      skip_integration_tests:
        type: boolean
        description: Skip integration tests (use on memory-constrained runners)
        default: false
  workflow_dispatch:
concurrency:
  group: tests_${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ vars.SKIP_FIREDANCER_CI != 'true' }}
    timeout-minutes: 30
    strategy:
      # We cannot possibly test everything on every commit.
      # This matrix is a tradeoff between required resources and
      # test coverage.  You should probably only remove machine
      # targets from here, not add more.
      fail-fast: true
      matrix:
        test-case:
          - linux_gcc_x86_64
          - linux_clang_icelake
          - native
        # Attach additional params to machine types
        include:
          - test-case: linux_gcc_x86_64
            machine: linux_gcc_x86_64
            label: X64
            extras: "rpath handholding"
            deps-extras: "+dev"
            targets: "all integration-test tickoni"
            compiler: gcc
            compiler-version: 11.4.0
            run-unit-tests: true
          - test-case: linux_clang_icelake
            machine: linux_clang_icelake
            label: icelake
            extras: "asan ubsan rpath handholding"
            deps-extras: "+dev"
            targets: "all integration-test tickoni"
            compiler: clang
            compiler-version: 19.1.7
            run-unit-tests: true
          - test-case: native
            machine: native
            label: 512G
            extras: "rpath handholding"
            deps-extras: "+dev"
            targets: "all integration-test tickoni"
            compiler: gcc
            compiler-version: 12.4.0
            run-unit-tests: true
            run-integration-tests: true
    runs-on:
      labels: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
    env:
      MACHINE: ${{ matrix.machine }}
      EXTRAS: ${{ matrix.extras || '' }}
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      TEST_OPTS: ${{ inputs.job_mem != '' && format('--job-mem {0}', inputs.job_mem) || '' }}
    steps:
      - name: cleanup
        if: always()
        run: |
          sudo killall firedancer-dev || true

      - uses: actions/checkout@v7

      - uses: ./.github/actions/deps
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler-version }}
          extras: ${{ matrix.deps-extras || '' }}
        if: ${{ !contains(matrix.extras, 'no-deps') }}

      - uses: ./.github/actions/hugepages
        if: ${{ matrix.run-unit-tests || matrix.run-integration-tests }}
        with:
          count_gigantic: ${{ inputs.gigantic_page_cnt || '64' }}

      - uses: ./.github/actions/cpusonline

      - name: clean targets
        run: |
          make clean --silent >/dev/null

      - name: build targets
        run: |
          source /opt/${{ matrix.compiler }}/${{ matrix.compiler }}-${{ matrix.compiler-version }}/activate
          ./contrib/make-j ${{ matrix.targets }}

      - name: run unit tests
        if: ${{ matrix.run-unit-tests }}
        run: |
          sudo prlimit --pid $$ --memlock=-1:-1
          source /opt/${{ matrix.compiler }}/${{ matrix.compiler }}-${{ matrix.compiler-version }}/activate
          make run-unit-test

      - name: run script tests
        if: ${{ matrix.run-unit-tests }}
        run: |
          sudo prlimit --pid $$ --memlock=-1:-1
          source /opt/${{ matrix.compiler }}/${{ matrix.compiler }}-${{ matrix.compiler-version }}/activate
          make run-script-test

      - name: run fuzz tests
        if: ${{ matrix.run-unit-tests }}
        run: |
          sudo prlimit --pid $$ --memlock=-1:-1
          source /opt/${{ matrix.compiler }}/${{ matrix.compiler }}-${{ matrix.compiler-version }}/activate
          make run-fuzz-test

      - name: run test-vector tests
        if: ${{ matrix.run-unit-tests && matrix.test-case == 'native' }}
        run: |
          sudo prlimit --pid $$ --memlock=-1:-1
          source /opt/${{ matrix.compiler }}/${{ matrix.compiler }}-${{ matrix.compiler-version }}/activate
          make run-test-vectors

      - name: run integration tests
        if: ${{ matrix.run-integration-tests && !inputs.skip_integration_tests }}
        run: |
          sudo prlimit --pid $$ --memlock=-1:-1
          source /opt/${{ matrix.compiler }}/${{ matrix.compiler }}-${{ matrix.compiler-version }}/activate
          make run-integration-test

      - name: run solcap tests
        if: ${{ matrix.run-unit-tests && matrix.test-case == 'native' }}
        run: |
          sudo prlimit --pid $$ --memlock=-1:-1
          source /opt/${{ matrix.compiler }}/${{ matrix.compiler }}-${{ matrix.compiler-version }}/activate
          DUMP=../dump make run-solcap-tests
