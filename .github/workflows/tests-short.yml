name: Tests / Short

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-short-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/(app/tickoni|tickoni)/|build\.zig(\.zon)?$|justfile$|contrib/quality\.sh$|contrib/security\.sh$|contrib/test/coverage(-tk)?\.json$|contrib/test/coverage\.sh$|contrib/readme/coverage_report\.py$|\.github/actions/|\.github/workflows/tests-short\.yml$)'

  short-tests:
    name: Harness Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Run test suite
        run: just test-unit-tk

  # ── macOS: Clang (x86_64, macOS 15) ────────────────────────────────────────
  short-tests-macos-15-intel:
    name: Harness Unit Tests / macOS 15 (Intel)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-intel

      - name: Run test suite
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache zig build -Dfd-lib-dir=build/fd-tickoni-fd/lib test --summary all

  # ── macOS: Clang (ARM64, macOS 15) ─────────────────────────────────────────
  short-tests-macos-15-arm:
    name: Harness Unit Tests / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-arm

      - name: Run test suite
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache zig build -Dfd-lib-dir=build/fd-tickoni-fd/lib test --summary all

  # ── macOS: Clang (x86_64, macOS 26) ────────────────────────────────────────
  short-tests-macos-26-intel:
    name: Harness Unit Tests / macOS 26 (Intel)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-intel

      - name: Run test suite
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache zig build -Dfd-lib-dir=build/fd-tickoni-fd/lib test --summary all

  # ── macOS: Clang (ARM64, macOS 26) ─────────────────────────────────────────
  short-tests-macos-26-arm:
    name: Harness Unit Tests / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-arm

      - name: Run test suite
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache zig build -Dfd-lib-dir=build/fd-tickoni-fd/lib test --summary all

  # ── macOS: Clang (x86_64, macOS 15) ────────────────────────────────────────
  integration-tests-macos-15-intel:
    name: Integration Tests / macOS 15 (Intel)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-intel

      - name: Run integration tests
        run: just test-integration-tk

  # ── macOS: Clang (ARM64, macOS 15) ─────────────────────────────────────────
  integration-tests-macos-15-arm:
    name: Integration Tests / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-arm

      - name: Run integration tests
        run: just test-integration-tk

  # ── macOS: Clang (x86_64, macOS 26) ────────────────────────────────────────
  integration-tests-macos-26-intel:
    name: Integration Tests / macOS 26 (Intel)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-intel

      - name: Run integration tests
        run: just test-integration-tk

  # ── macOS: Clang (ARM64, macOS 26) ─────────────────────────────────────────
  integration-tests-macos-26-arm:
    name: Integration Tests / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-arm

      - name: Run integration tests
        run: just test-integration-tk

  integration-tests-tk:
    name: Harness Integration Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Run test suite
        run: just test-integration-tk

  cov-tk:
    name: Harness Tests Coverage
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'true'

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Run coverage
        run: just test-cov-tk

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tk
          path: build/coverage/tk/coverage-summary.json
