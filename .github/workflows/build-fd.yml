name: Build Firedancer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^((src/disco/|src/tango/|src/waltz/|src/util/|contrib/deps-bundle\.sh$|contrib/fd-build-lib\.sh$|contrib/fd-tk-libs\.sh$|build\.zig$|GNUmakefile$|\.github/actions/build-fd-tk-libs/|\.github/workflows/build-fd\.yml$)|deps\.sh$)'

  # ── Linux: GCC (x86_64) ────────────────────────────────────────────────────
  build-linux-gcc:
    name: Engine Build / Linux GCC
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 12
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Setup deps
        uses: ./.github/actions/setup-public-gh-runner
        with:
          fd-deps: 'true'
          compiler: gcc
          compiler-version: system

      - name: Build
        run: just build-fd-gcc

  # ── Linux: Clang (x86_64) ──────────────────────────────────────────────────
  build-linux-clang:
    name: Engine Build / Linux Clang
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Setup deps
        uses: ./.github/actions/setup-public-gh-runner
        with:
          fd-deps: 'true'
          compiler: clang
          compiler-version: system

      - name: Build
        run: just build-fd-clang

  # ── Linux: GCC (ARM64) ─────────────────────────────────────────────────────
  build-linux-arm:
    name: Engine Build / Linux ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Setup deps
        uses: ./.github/actions/setup-public-gh-runner
        with:
          fd-deps: 'true'
          compiler: gcc
          compiler-version: system

      - name: Build
        run: just build-fd-arm

  # ── macOS: Clang (x86_64) ──────────────────────────────────────────────────
  build-macos-intel:
    name: Engine Build / macOS Intel
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install gmake (GNU Make)
        run: |
          # Homebrew may mark gmake as "not usable" — force reinstall to fix
          if brew info gmake 2>/dev/null | grep -q "not usable"; then
            brew unlink gmake 2>/dev/null || true
            brew reinstall gmake
          else
            brew install gmake
          fi

      - name: Verify gmake
        run: |
          echo "gmake version: $(gmake --version | head -1)"
          gmake --version | grep -q 'GNU Make' || { echo "ERROR: gmake is not GNU make!"; exit 1; }

      - name: Setup deps
        uses: ./.github/actions/setup-public-gh-runner
        with:
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - name: Build
        run: just build-fd-macos-intel

  # ── macOS: Clang (ARM64) ───────────────────────────────────────────────────
  build-macos-arm:
    name: Engine Build / macOS ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        uses: ./.github/actions/setup-public-gh-runner
        with:
          fd-deps: 'true'
          compiler: clang
          compiler-version: system

      - name: Build
        run: just build-fd-macos-arm
